{% extends "base.html" %}
{% block title %}Create account — RouteBoard{% endblock %}

{% block content %}
<section class="section container">
  <div class="card form-narrow">
    <p class="eyebrow" style="color:var(--teal);">Join RouteBoard</p>
    <h2 style="font-family:var(--font-display); font-size:1.8rem; margin-top:4px;">Create your account</h2>
    <form method="post">
      <div class="role-toggle">
        <label><input type="radio" name="role" value="passenger" checked> Passenger</label>
        <label><input type="radio" name="role" value="driver"> Driver</label>
      </div>
      <div class="form-group">
        <label for="name">Full name</label>
        <input id="name" name="name" type="text" required>
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required minlength="6">
      </div>
      <div class="form-group">
        <label for="license_no">Driver license no. (drivers only)</label>
        <input id="license_no" name="license_no" type="text" placeholder="Leave blank if passenger">
      </div>
      <button class="btn btn-amber btn-block" type="submit">Create account</button>
    </form>
    <p style="margin-top:16px; font-size:0.9rem; color:var(--text-muted);">
      Already have an account? <a href="{{ url_for('login') }}" style="color:var(--teal); font-weight:600;">Sign in</a>
    </p>
  </div>
</section>
{% endblock %}
