{% extends "base.html" %}
{% block title %}Sign in — RouteBoard{% endblock %}

{% block content %}
<section class="section container">
  <div class="card form-narrow">
    <p class="eyebrow" style="color:var(--teal);">Welcome back</p>
    <h2 style="font-family:var(--font-display); font-size:1.8rem; margin-top:4px;">Sign in</h2>
    <form method="post">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" required>
      </div>
      <button class="btn btn-amber btn-block" type="submit">Sign in</button>
    </form>
    <p style="margin-top:16px; font-size:0.9rem; color:var(--text-muted);">
      New here? <a href="{{ url_for('register') }}" style="color:var(--teal); font-weight:600;">Create an account</a>
    </p>
    <p style="margin-top:20px; font-size:0.8rem; color:var(--text-muted); border-top:1px dashed var(--line); padding-top:12px;">
      Demo logins &mdash; Admin: admin@routeboard.test / admin123 &middot;
      Driver: driver@routeboard.test / driver123
    </p>
  </div>
</section>
{% endblock %}
